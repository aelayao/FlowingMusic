name: flowing_music
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3 # A package for state management and navigation in Flutter
  # percent_indicator: ^4.2.5 # muestra progreso en una linea o circulo(?) solo de porcentaje?
  path_provider: ^2.1.6 # Da acceso a los paths de los archivos del dispositivo
  # on_audio_query: ^2.9.0 # toma los archivos de autio del dispositivo y los organiza
  permission_handler: ^13.0.2 # para pedir permisos de utilizar los archivos del dispositivo 
  path: ^1.9.1 # para manipular rutas
  #flutter_storage_path: ^1.0.4 # para obtener las rutas de archivos
  audio_metadata_reader: ^1.8.1
  just_audio: ^0.10.6 # audio player para aplicaciones de flutter
  material_ui: ^1.11.1
  on_audio_query_pluse: ^3.0.7
  # https://github.com/Hamad-Anwar/Neumorphic-Music_Player-Flutter
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/home_bg.png
    - assets/listas_bg.png
    - assets/ply_bg.png
    
  fonts:
    - family: Gabarito
      fonts:
        - asset: fonts/Gabarito-Black.ttf
        - asset: fonts/Gabarito-Bold.ttf
        - asset: fonts/Gabarito-ExtraBold.ttf
        - asset: fonts/Gabarito-Medium.ttf
        - asset: fonts/Gabarito-Regular.ttf
        - asset: fonts/Gabarito-SemiBold.ttf
        - asset: fonts/Gabarito-VariableFont_wght.ttf
    - family: RussoOne
      fonts:
        - asset: fonts/RussoOne-Regular.ttf
  # https://docs.flutter.dev/cookbook/design/fonts